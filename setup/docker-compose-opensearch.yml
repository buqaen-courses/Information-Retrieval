services:
  opensearch:
    # Image registry prefix is configurable so the course works behind a
    # Docker Hub pull limit. Default: the public Docker Hub path.
    # Set OS_IMAGE_PREFIX to e.g. "docker.devneeds.ir/" to use a mirror.
    image: ${OS_IMAGE_PREFIX:-}opensearchproject/opensearch:2.13.0
    container_name: ir-course-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch-dashboards:
    image: ${OS_IMAGE_PREFIX:-}opensearchproject/opensearch-dashboards:2.13.0
    container_name: ir-course-dashboards
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
